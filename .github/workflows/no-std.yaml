name: no_std check
on:
  pull_request:
    paths:
      - .github/workflows/no-std.yaml
      - Cargo.toml
      - Cargo.lock
      - ci/**
      - crates/**
  push:
    branches: main
    paths:
      - .github/workflows/no-std.yaml
      - Cargo.toml
      - Cargo.lock
      - ci/**
      - crates/**

jobs:
  check-no-std-panic-conflict:
    name: Check no_std panic conflict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: |
          cd ci/no-std-check
          make check-panic-conflict

  check-substrate:
    name: Check no_std substrate support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Keep in step with NIGHTLY_VERSION in ci/no-std-check/Makefile, which explains
          # why the toolchain is pinned rather than tracking nightly.
          toolchain: nightly-2026-08-12
          target: wasm32-unknown-unknown
      - run: |
          cd ci/no-std-check
          make check-substrate
